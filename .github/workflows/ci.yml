name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install uv -r requirements-dev.txt
      - run: uv lock --check
      - run: ruff check app.py oracle scripts tests
      - run: pytest -q
      - run: python -m compileall -q app.py oracle scripts tests
      - run: python scripts/build_package.py
