[project]
name = "team-a-crypto-web"
version = "0.2.0"
description = "Team-A cryptocurrency market intelligence dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.2",
]

[tool.uv]
default-groups = []

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
